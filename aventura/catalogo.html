<title>Eromash · Catálogo de la aventura</title>
<link rel="stylesheet" href="css/aventura.css" />
<style>
  body { background: #111111; color: #F2ECEC; margin: 0; padding: 24px; font-family: "Eromash Text", system-ui, sans-serif; }
  h1 { font-family: "Eromash Display", system-ui, sans-serif; margin: 0 0 4px; }
  .sub { color: #E0B2B2; margin: 0 0 24px; }
  h2 { font-family: "Eromash Display", system-ui, sans-serif; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #FFD98A; margin: 28px 0 10px; }
  .grilla { display: flex; flex-wrap: wrap; gap: 12px; }
  .ficha { background: #1C1714; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .ficha canvas { display: block; }
  .ficha p { margin: 0; padding: 8px 12px 10px; font-size: 14px; }
</style>
</head>
