<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eromash · Eikholt</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #F2ECEC; font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; left: 12px; top: 12px; width: 300px; background: rgba(17,17,17,0.86); padding: 14px; box-sizing: border-box; border: 1px solid #5E130D; }
  #panel h1 { font-size: 17px; margin: 0 0 6px; color: #FFD98A; }
  #panel p { font-size: 12px; color: #E0B2B2; margin: 0 0 10px; line-height: 1.4; }
  label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin: 6px 0; gap: 8px; }
  input[type=range] { flex: 1; }
  button { font: inherit; font-size: 12px; background: #2A1E1A; color: #F2ECEC; border: 1px solid #5E130D; padding: 5px 8px; margin: 3px 3px 3px 0; cursor: pointer; }
  button:hover { background: #9C2315; }
  @media (max-width: 600px) { #panel { width: calc(100% - 24px); } }
</style>
</head>
<body>
<canvas id="vista"></canvas>
<div id="panel">
  <h1 id="tTitulo"></h1>
  <p id="tTexto"></p>
  <label><span id="tGiro"></span><input id="giro" type="range" min="-180" max="180" value="-28" /></label>
  <label><span id="tAltura"></span><input id="altura" type="range" min="40" max="100" value="55" /></label>
  <label><span id="tCerca"></span><input id="cerca" type="range" min="4" max="120" value="40" /></label>
  <label><span id="tHora"></span><input id="hora" type="range" min="0" max="24" step="0.25" value="17.5" /><span id="vHora" style="min-width:36px;text-align:right"></span></label>
  <label><span id="tGirar"></span><input id="girar" type="checkbox" /></label>
  <div id="lugares"></div>
</div>
<script src="../juego/js/comun/calidad.js"></script>
<script src="../juego/js/comun/i18n.js"></script>
<script src="js/textos/aventura.js"></script>
<script src="js/textos/capital.js"></script>
<script src="js/textos/ciudad.js"></script>
<script src="../juego/js/comun/vikingos.js"></script>
<script src="js/comun/dibujo.js"></script>
<script src="js/comun/futhark.js"></script>
<script src="js/mundo/assets.js"></script>
<script src="js/mundo/assets-eikholt.js"></script>
<script src="js/mundo/assets-capital.js"></script>
<script src="js/mundo/assets-ciudad.js"></script>
<script src="js/mundo/assets-interiores.js"></script>
<script src="js/mundo/assets-secretos.js"></script>
<script src="js/mundo/assets-este.js"></script>
<script src="js/mundo/assets-senda.js"></script>
<script src="js/mundo/assets-puesto.js"></script>
<script src="js/mundo/assets-norte.js"></script>
<script src="js/personajes/vikingo.js"></script>
<script src="js/personajes/gente.js"></script>
<script src="js/motor/capital.js"></script>
<script src="js/mundo/caminos.js"></script>
<script src="js/ciudad/casas.js"></script>
<script src="js/ciudad/puestos.js"></script>
<script src="js/ciudad/muralla.js"></script>
<script src="js/ciudad/roble.js"></script>
<script src="js/ciudad/ting.js"></script>
<script src="js/ciudad/oficios.js"></script>
<script src="js/ciudad/porton.js"></script>
<script src="js/ciudad/plano.js"></script>
<script src="js/ciudad/vista.js"></script>
<script src="js/mundo/luz.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("lang")) I18N.setLang(q.get("lang"));
  const t = (k) => I18N.t(k);
  document.title = "Eromash · " + t("ci.muestra_titulo");
  tTitulo.textContent = t("ci.muestra_titulo");
  tTexto.textContent = t("ci.muestra_texto");
  tGiro.textContent = t("ci.muestra_giro");
  tAltura.textContent = t("ci.muestra_altura");
  tCerca.textContent = t("ci.muestra_cerca");
  tGirar.textContent = t("ci.muestra_girar");
  tHora.textContent = t("ci.muestra_hora");
  if (q.get("panel") === "0") panel.style.display = "none";
  const plano = PLANO25.armar();
  VISTA25.iniciar(plano);
  const c = vista.getContext("2d");
  let cw = 0, ch = 0;
  function medir() {
    cw = vista.width = innerWidth;
    ch = vista.height = innerHeight;
  }
  addEventListener("resize", medir);
  medir();
  const L = plano.lugares;
  const LUGARES = {
    plaza: [L.ting[0] + 900, L.ting[1] + 300],
    ting: [L.ting[0], L.ting[1] + 200],
    sur: plano.anclas.puerta_sur,
    oficios: [L.herreria[0] + 400, L.herreria[1] + 900],
    lindes: [L.lindes[0] + 300, L.lindes[1] + 500],
    hongo: [L.hongo[0], L.hongo[1] + 900],
    guardia: [L.entrenamiento[0] + 300, L.entrenamiento[1] + 700],
    caravanas: [L.forasteros[0] + 600, L.forasteros[1] + 1200],
    sanacion: [L.sanacion[0] + 600, L.sanacion[1] + 700],
    muelle: [plano.anclas.muelle[0] + 300, plano.anclas.muelle[1] + 500],
    lejos: [0, 600],
  };
  const cam = { x: LUGARES.plaza[0], y: LUGARES.plaza[1], g: -0.49, k: 0.55, esc: 0.4 };
  const objetivo = { x: cam.x, y: cam.y };
  for (const k in LUGARES) {
    const b = document.createElement("button");
    b.textContent = t("ci.lugar_" + k);
    b.onclick = () => {
      objetivo.x = LUGARES[k][0];
      objetivo.y = LUGARES[k][1];
      if (k === "lejos") cerca.value = 4;
      else if (cerca.value < 20) cerca.value = 40;
    };
    lugares.appendChild(b);
  }
  if (q.get("en")) {
    const k = q.get("en");
    if (LUGARES[k]) { cam.x = objetivo.x = LUGARES[k][0]; cam.y = objetivo.y = LUGARES[k][1]; }
  }
  if (q.get("x")) { cam.x = objetivo.x = +q.get("x"); cam.y = objetivo.y = +q.get("y"); }
  if (q.get("g")) giro.value = q.get("g");
  if (q.get("k")) altura.value = q.get("k");
  if (q.get("z")) cerca.value = q.get("z");
  if (q.get("h")) hora.value = q.get("h");
  // la gente de la plaza: vecinos parados y caminando, y Eromash
  const gente = [];
  const ids = Object.keys(GENTE.FICHAS);
  const rr = (function (s) { let a = s; return () => ((a = (a * 16807) % 2147483647) / 2147483647); })(77);
  for (let i = 0; i < 140; i++) {
    const a = rr() * Math.PI * 2, d = 900 + rr() * 2700;
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (plano.choques.some((h) => h.circulo && Math.hypot(h.circulo[0] - x, h.circulo[1] - y) < h.circulo[2] + 40)) continue;
    gente.push({ id: ids[i % ids.length], x, y, vx: rr() < 0.5 ? (rr() - 0.5) * 80 : 0, vy: 0, s: 1, horas: i % 7 ? [7, 20] : [6, 23] });
  }
  const sur = plano.anclas.puerta_sur;
  for (let i = 0; i < 18; i++) gente.push({ id: ids[(i * 7) % ids.length], x: sur[0] + (rr() - 0.5) * 300, y: sur[1] - rr() * 3000, vx: 0, vy: (rr() < 0.5 ? -1 : 1) * 60, s: 1, horas: i % 6 ? [6, 21] : [0, 24] });
  // la gente de cada barrio: los de la Guardia en el campo, los forasteros alrededor del fuego, los que esperan en
  // Sanación, los que toman afuera del Hongo, los de los oficios (parados, que hablan; alguno va y viene)
  const RONDAS = [
    ["entrenamiento", 10, 700, ["eydis", "orm"]],
    ["forasteros", 9, 520, null],
    ["sanacion", 6, 700, ["herido", "svanhild", "trabajador"]],
    ["hongo", 8, 900, null],
    ["herreria", 6, 650, null],
    ["carpinteria", 5, 700, null],
    ["corral", 4, 900, ["trabajador", "trabajador3"]],
    ["lindes", 4, 600, null],
    ["hospederia", 4, 600, null],
    ["tablon", 4, 300, null],
  ];
  // cada barrio tiene su hora: el campo de la Guardia de mañana, el Hongo y el fuego de los forasteros de noche,
  // los oficios de día; nadie lo marca, se ve si se pasa a la hora justa
  const HORARIO = {
    entrenamiento: [6.5, 17], forasteros: [17, 6], sanacion: [7, 22], hongo: [16, 2], herreria: [6, 19],
    carpinteria: [7, 18], corral: [5, 20], lindes: [8, 20], hospederia: [15, 1], tablon: [7, 19],
  };
  const aHora = (h, [a, b]) => (a < b ? h >= a && h < b : h >= a || h < b);
  // lo que se ve y nadie explica: de madrugada alguien se queda solo frente a la piedra del Ting; al alba, los de la
  // Guardia hacen la ronda por la vuelta de la plaza
  const TING = plano.ting;
  gente.push({ id: "eydis", x: TING[0] + 60, y: TING[1] + 230, vx: 0, vy: 0, s: 1, horas: [23, 4] });
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    gente.push({ id: i % 2 ? "orm" : "eydis", x: Math.cos(a) * 3000, y: Math.sin(a) * 3000, vx: -Math.sin(a) * 50, vy: Math.cos(a) * 50, s: 1, horas: [5, 8], ronda: true });
  }
  for (const [k, n, rad, quien] of RONDAS) {
    const c0 = L[k];
    if (!c0) continue;
    for (let i = 0; i < n; i++) {
      const a = rr() * Math.PI * 2, d = rad * (0.4 + rr() * 0.6);
      const x = c0[0] + Math.cos(a) * d, y = c0[1] + Math.sin(a) * d;
      if (plano.choques.some((h) => h.circulo && Math.hypot(h.circulo[0] - x, h.circulo[1] - y) < h.circulo[2] + 30)) continue;
      const lista = quien || ids;
      gente.push({ id: lista[Math.floor(rr() * lista.length)], x, y, vx: rr() < 0.3 ? (rr() - 0.5) * 70 : 0, vy: 0, s: 1, habla: rr() < 0.5, horas: HORARIO[k] });
    }
  }
  // los choques del plano en una grilla, para preguntar rápido si un punto está libre
  const CELDA = 400, grilla = new Map();
  for (const h of plano.choques) {
    let x0, y0, x1, y1;
    if (h.circulo) { const [x, y, r] = h.circulo; x0 = x - r; x1 = x + r; y0 = y - r; y1 = y + r; }
    else if (h.poli) { const xs = h.poli.map((q) => q[0]), ys = h.poli.map((q) => q[1]); x0 = Math.min(...xs); x1 = Math.max(...xs); y0 = Math.min(...ys); y1 = Math.max(...ys); }
    else continue;
    for (let gy = Math.floor(y0 / CELDA); gy <= Math.floor(y1 / CELDA); gy++)
      for (let gx = Math.floor(x0 / CELDA); gx <= Math.floor(x1 / CELDA); gx++) {
        const k = gx + "," + gy;
        if (!grilla.has(k)) grilla.set(k, []);
        grilla.get(k).push(h);
      }
  }
  const dentroPoli = (pts, x, y) => {
    let d = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) d = !d;
    }
    return d;
  };
  function libre(x, y) {
    const l = grilla.get(Math.floor(x / CELDA) + "," + Math.floor(y / CELDA));
    if (!l) return true;
    for (const h of l) {
      if (h.circulo && Math.hypot(h.circulo[0] - x, h.circulo[1] - y) < h.circulo[2] + 20) return false;
      if (h.poli && dentroPoli(h.poli, x, y)) return false;
    }
    return true;
  }
  for (let i = gente.length - 1; i >= 0; i--) if (!libre(gente[i].x, gente[i].y)) gente.splice(i, 1);
  // lo que alumbra de noche: faroles, braseros y fuegos (y las runas), y las ventanas de cada casa
  const luces = [];
  for (const o of plano.cosas) {
    if (o.tipo === "casa") {
      if (/^(casa|hongo|lindes|herreria|sanacion|hospederia|cuartel|carpinteria|curtiembre|cordeleria)/.test(o.nombre || "")) luces.push({ x: o.x, y: o.y, z: 0, r: 520, col: "#FFD98A", f: 0.45 });
      if (/^(puerta_|atalaya)/.test(o.nombre || "")) luces.push({ x: o.x, y: o.y, z: 0, r: 700, col: "#FFD98A", f: 0.8 });
      continue;
    }
    const id = o.id || "";
    if (/farol|Farol|brasero|fogon|posteHongo|chimeneaHerreria/.test(id)) luces.push({ x: o.x, y: o.y, z: 0, r: /fogon|chimenea/.test(id) ? 900 : /brasero/.test(id) ? 520 : 420, col: "#FFD98A", f: /fogon|chimenea/.test(id) ? 1 : 0.85, fuego: /brasero|fogon|chimenea/.test(id) });
  }
  // los faroles colgados de la copa del Roble
  for (let i = 0; i < 6; i++) luces.push({ x: Math.cos(i * 1.05) * 700, y: Math.sin(i * 1.05) * 500, z: 0, r: 600, col: "#FFD98A", f: 0.7 });
  // la piedra del Ting y las piedras rúnicas de las puertas, en azul rúnico
  luces.push({ x: plano.ting[0], y: plano.ting[1], z: 0, r: 900, col: "#73D5DB", f: 0.6 });
  for (const k of ["sur", "norte", "este", "oeste"]) { const a = plano.anclas["puerta_" + k]; if (a) luces.push({ x: a[0], y: a[1], z: 0, r: 800, col: "#73D5DB", f: 0.7 }); }
  const VK = { S: VIKINGO.imagen("R", "S", "calm"), E: VIKINGO.imagen("R", "E", "calm"), N: VIKINGO.imagen("R", "N", "calm") };
  const eromash = { x: LUGARES.plaza[0] - 200, y: LUGARES.plaza[1] - 100 };
  function dibujarEromash(c, x, y) {
    const k = 1 / 1.96;
    c.save();
    c.translate(x, y);
    c.scale(k, k);
    DIB.E(c, 0, 0, 58, 16, "rgba(0,0,0,0.45)");
    const img = VK.S;
    if (img.complete) c.drawImage(img, -62, -150, 125, 150);
    c.restore();
  }
  const teclas = {};
  addEventListener("keydown", (e) => (teclas[e.code] = true));
  addEventListener("keyup", (e) => (teclas[e.code] = false));
  vista.addEventListener("wheel", (e) => { cerca.value = Math.max(4, Math.min(120, +cerca.value - Math.sign(e.deltaY) * 4)); e.preventDefault(); }, { passive: false });
  let arr = null;
  vista.addEventListener("pointerdown", (e) => { arr = [e.clientX, e.clientY, cam.x, cam.y]; vista.setPointerCapture(e.pointerId); });
  vista.addEventListener("pointermove", (e) => {
    if (!arr) return;
    const V = VISTA25.proyector(cam);
    const a = V.inversa(cam.x - (e.clientX - arr[0]) / cam.esc, cam.y - (e.clientY - arr[1]) / cam.esc);
    objetivo.x = a[0]; objetivo.y = a[1];
    arr = [e.clientX, e.clientY, objetivo.x, objetivo.y];
  });
  vista.addEventListener("pointerup", () => (arr = null));
  let t0 = performance.now(), tt = 0;
  function cuadro(ahora) {
    const dt = Math.min(0.05, (ahora - t0) / 1000);
    t0 = ahora;
    tt += dt;
    if (girar.checked) giro.value = ((+giro.value + 180 + dt * 14) % 360) - 180;
    if (teclas.KeyZ) giro.value = ((+giro.value + 180 - dt * 60 + 360) % 360) - 180;
    if (teclas.KeyX) giro.value = ((+giro.value + 180 + dt * 60) % 360) - 180;
    // mover con las flechas, relativo a la cámara
    let mx = (teclas.KeyD || teclas.ArrowRight ? 1 : 0) - (teclas.KeyA || teclas.ArrowLeft ? 1 : 0);
    let my = (teclas.KeyS || teclas.ArrowDown ? 1 : 0) - (teclas.KeyW || teclas.ArrowUp ? 1 : 0);
    if (mx || my) {
      const g = cam.g, v = 1400 * dt / Math.max(0.2, cam.esc * 2);
      objetivo.x += (mx * Math.cos(g) + my * Math.sin(g)) * v;
      objetivo.y += (-mx * Math.sin(g) + my * Math.cos(g)) * v;
    }
    const gObj = (+giro.value * Math.PI) / 180;
    let dg = Math.atan2(Math.sin(gObj - cam.g), Math.cos(gObj - cam.g));
    cam.g += dg * Math.min(1, dt * 8);
    cam.k += (+altura.value / 100 - cam.k) * Math.min(1, dt * 6);
    const escObj = (+cerca.value / 100) * Math.sqrt((cw * ch) / (1600 * 900));
    cam.esc += (escObj - cam.esc) * Math.min(1, dt * 6);
    cam.x += (objetivo.x - cam.x) * Math.min(1, dt * 6);
    cam.y += (objetivo.y - cam.y) * Math.min(1, dt * 6);
    // los que caminan no atraviesan nada: si el paso siguiente choca, se dan vuelta
    for (const p of gente) {
      if (!p.vx && !p.vy) continue;
      if (p.ronda) {
        // la ronda sigue la vuelta de la plaza
        const a = Math.atan2(p.y, p.x) + (50 / 3000) * dt;
        p.x = Math.cos(a) * 3000; p.y = Math.sin(a) * 3000; p.vx = -Math.sin(a) * 50;
        continue;
      }
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (!libre(nx, ny) || Math.random() < dt * 0.15) { p.vx = -p.vx; p.vy = -p.vy; continue; }
      p.x = nx; p.y = ny;
    }
    const h = +hora.value;
    vHora.textContent = String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round((h % 1) * 60)).padStart(2, "0");
    const extra = gente.filter((p) => !p.horas || aHora(h, p.horas)).map((p) => ({ x: p.x, y: p.y, f: (c, sx, sy) => GENTE.dibujar(c, p.id, sx, sy, tt, { vista: "S", camina: !!(p.vx || p.vy), espejo: p.vx < 0, hablando: p.habla && Math.sin(tt * 0.7 + p.x) > 0.3 }) }));
    extra.push({ x: eromash.x, y: eromash.y, f: dibujarEromash });
    VISTA25.dibujar(c, cam, cw, ch, tt, extra);
    // el aire de la tarde: un velo cálido y la viñeta del bosque
    c.setTransform(1, 0, 0, 1, 0, 0);
    // la luz según la hora: la tarde ámbar (el primer respiro después del bosque frío), la noche azul con los faroles,
    // las ventanas y los fuegos encendidos; calidad baja deja solo el velo
    const noche = h >= 17 && h < 21 ? (h - 17) / 4 : h >= 21 || h < 5 ? 1 : h < 7 ? (7 - h) / 2 : 0;
    const ambar = Math.max(0.25, 1 - Math.min(Math.abs(h - 18), 24 - Math.abs(h - 18)) / 7);
    if (!window.CALIDAD || CALIDAD.nivel !== "baja") {
      c.globalCompositeOperation = "soft-light";
      const am = c.createLinearGradient(0, 0, cw, ch);
      am.addColorStop(0, "rgba(255,217,138," + (0.55 * ambar * (1 - noche * 0.7)) + ")");
      am.addColorStop(1, "rgba(255,141,113," + (0.35 * ambar * (1 - noche * 0.7)) + ")");
      c.fillStyle = am;
      c.fillRect(0, 0, cw, ch);
      c.globalCompositeOperation = "source-over";
    }
    // la noche con la misma capa de oscuridad del bosque (LUZ): agujeros de luz en el piso donde alumbra algo
    if (noche > 0.01) {
      const V = VISTA25.proyector(cam);
      const enVista = [];
      for (const l of luces) {
        const [vx, vy] = V(l.x, l.y);
        const sx = (vx - cam.x) * cam.esc + cw / 2, sy = (vy - cam.y) * cam.esc + ch / 2 - l.z * cam.esc;
        const r = l.r * cam.esc;
        if (!(r > 1)) continue;
        if (sx < -r || sy < -r || sx > cw + r || sy > ch + r) continue;
        enVista.push({ x: sx, y: sy, r, col: l.col, f: l.fuego ? l.f * (0.9 + Math.sin(tt * 7 + l.x) * 0.08) : l.f });
      }
      LUZ.dibujar(c, cw, ch, 0, 0, 1, enVista, { o: 0, n: noche, osc: Math.min(0.82, 0.06 + noche * 0.74) }, tt);
    }
    c.fillStyle = "rgba(255,141,113,0.05)";
    c.fillRect(0, 0, cw, ch);
    const g = c.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
    g.addColorStop(0, "rgba(10,14,12,0)");
    g.addColorStop(1, "rgba(10,14,12,0.55)");
    c.fillStyle = g;
    c.fillRect(0, 0, cw, ch);
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
  window.MUESTRA = { cam, objetivo, plano };
})();
</script>
</body>
</html>
