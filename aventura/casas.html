<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eromash · Casas de Eikholt</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #F2ECEC; font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: rgba(17,17,17,0.92); padding: 16px; box-sizing: border-box; overflow: auto; }
  #panel h1 { font-size: 18px; margin: 0 0 6px; color: #FFD98A; }
  #panel p { font-size: 13px; color: #E0B2B2; margin: 0 0 12px; }
  label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 6px 0; gap: 8px; }
  input[type=range] { flex: 1; }
  select, button, textarea { font: inherit; font-size: 13px; background: #2A1E1A; color: #F2ECEC; border: 1px solid #5E130D; padding: 6px 8px; }
  button { cursor: pointer; margin: 4px 4px 4px 0; }
  button.rojo { background: #9C2315; border-color: #C8402D; }
  textarea { width: 100%; height: 150px; box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="vista"></canvas>
<div id="panel" class="ui">
  <h1 id="tTitulo"></h1>
  <p id="tTexto"></p>
  <div id="campos"></div>
  <button class="rojo" id="bOtra"></button>
  <button id="bTodas"></button>
  <p id="tFicha" style="margin-top:12px"></p>
  <textarea id="ficha" spellcheck="false"></textarea>
</div>
<script src="../juego/js/comun/i18n.js"></script>
<script src="js/textos/eikholt.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/eikholt/geo.js"></script>
<script src="js/eikholt/casas.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("lang")) I18N.setLang(q.get("lang"));
  const t = (k) => I18N.t(k);
  document.title = "Eromash · " + t("ek.banco_titulo");
  tTitulo.textContent = t("ek.banco_titulo");
  tTexto.textContent = t("ek.banco_texto");
  bOtra.textContent = t("ek.banco_otra");
  bTodas.textContent = t("ek.banco_todas");
  tFicha.textContent = t("ek.banco_ficha");
  const ren = new THREE.WebGLRenderer({ canvas: vista, antialias: true });
  ren.shadowMap.enabled = true;
  ren.shadowMap.type = THREE.PCFSoftShadowMap;
  const esc = new THREE.Scene();
  esc.background = new THREE.Color("#1E2A2A");
  esc.add(new THREE.HemisphereLight(0x9fb4c8, 0x2a2018, 0.55));
  const sol = new THREE.DirectionalLight(0xfff0d8, 0.9);
  sol.position.set(30, 40, 20);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 140 });
  esc.add(sol);
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x3e4a30 }));
  piso.rotation.x = -Math.PI / 2;
  piso.receiveShadow = true;
  esc.add(piso);
  const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
  let yaw = 0.6, pitch = 0.45, distc = 28, foco = new THREE.Vector3();
  function medir() {
    const w = innerWidth - 320, h = innerHeight;
    ren.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    ren.setSize(w, h);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
  }
  addEventListener("resize", medir);
  medir();
  let arr = null;
  vista.addEventListener("pointerdown", (e) => (arr = { x: e.clientX, y: e.clientY }));
  addEventListener("pointerup", () => (arr = null));
  addEventListener("pointermove", (e) => {
    if (!arr) return;
    yaw -= (e.clientX - arr.x) * 0.006;
    pitch = Math.max(0.08, Math.min(1.4, pitch + (e.clientY - arr.y) * 0.004));
    arr = { x: e.clientX, y: e.clientY };
  });
  vista.addEventListener("wheel", (e) => (distc = Math.max(6, Math.min(120, distc * (e.deltaY > 0 ? 1.1 : 0.9)))), { passive: true });

  const CAMPOS = [
    ["ancho", 4, 16, 0.1], ["fondo", 3.5, 12, 0.1], ["pisos", 1, 2, 1], ["zocalo", 0, 1.4, 0.05],
    ["pared", ["tablasH", "tablasV", "troncos", "piedra", "mixta"]],
    ["techo.tipo", ["dosAguas", "cuatroAguas", "cesped"]], ["techo.pendiente", 0.6, 1.8, 0.05], ["techo.musgo", 0, 1, 0.05],
    ["buhardillas", 0, 3, 1], ["dragones", [false, true]], ["porche", [null, { fondo: 1.8 }]], ["anexo", [null, { lado: 1, ancho: 2.4, fondo: 4 }]],
    ["cartel", [null, "hongo", "yunque", "hierba", "soga", "lanza", "pluma", "hacha"]], ["entrable", [false, true]],
  ];
  let ficha = {}, sem = 7, grupo = null;
  const dar = (o, k, v) => {
    const p = k.split(".");
    if (p.length > 1) (o[p[0]] = o[p[0]] || {})[p[1]] = v;
    else o[k] = v;
  };
  CAMPOS.forEach(([k, a, b, s]) => {
    const l = document.createElement("label");
    l.textContent = t("ek.banco_" + k.replace(".", "_"));
    let el;
    if (Array.isArray(a)) {
      el = document.createElement("select");
      a.forEach((v, i) => {
        const op = document.createElement("option");
        op.value = i;
        op.textContent = v === null ? "—" : typeof v === "object" ? "✓" : String(v);
        el.appendChild(op);
      });
      el.innerHTML = '<option value="-1">' + t("ek.banco_azar") + "</option>" + el.innerHTML;
      el.onchange = () => {
        if (el.value === "-1") delete ficha[k];
        else dar(ficha, k, a[Number(el.value)]);
        armar();
      };
    } else {
      el = document.createElement("input");
      el.type = "range";
      Object.assign(el, { min: a, max: b, step: s, value: a });
      el.oninput = () => {
        dar(ficha, k, Number(el.value));
        armar();
      };
    }
    l.appendChild(el);
    campos.appendChild(l);
  });
  function limpiar() {
    while (esc.children.length > 3) esc.remove(esc.children[3]);
  }
  function armar() {
    limpiar();
    const c = CASAS.crear(JSON.parse(JSON.stringify(ficha)), sem);
    esc.add(c.grupo);
    foco.set(0, 2.5, 0);
    ficha_.value = JSON.stringify(Object.assign({}, c.ficha), null, 1);
  }
  const ficha_ = document.getElementById("ficha");
  ficha_.onchange = () => {
    try {
      ficha = JSON.parse(ficha_.value);
      armar();
    } catch (e) {}
  };
  bOtra.onclick = () => {
    sem = Math.floor(Math.random() * 99999);
    armar();
  };
  bTodas.onclick = () => {
    limpiar();
    for (let i = 0; i < 16; i++) {
      const c = CASAS.crear({}, 100 + i * 17 + sem);
      c.grupo.position.set((i % 4) * 16 - 24, 0, Math.floor(i / 4) * 16 - 24);
      c.grupo.rotation.y = (i % 3) * 0.3;
      esc.add(c.grupo);
    }
    distc = 90;
    foco.set(0, 0, 0);
  };
  if (q.get("todas")) bTodas.onclick();
  else armar();
  (function cuadro() {
    cam.position.set(foco.x + Math.sin(yaw) * Math.cos(pitch) * distc, foco.y + Math.sin(pitch) * distc, foco.z + Math.cos(yaw) * Math.cos(pitch) * distc);
    cam.lookAt(foco);
    ren.render(esc, cam);
    requestAnimationFrame(cuadro);
  })();
})();
</script>
</body>
</html>
