<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eromash · Editor de Eldervald</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%239C2315'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/aventura.css" />
<style>
  /* el mapa a la izquierda, el panel de objetos y herramientas a la derecha */
  html, body { margin: 0; height: 100%; background: #111111; color: #F2ECEC; font-family: "Eromash Text", system-ui, sans-serif; overflow: hidden; }
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
  #mapa { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; background: #1E2C1B; }
  aside { background: #1C1714; border-left: 1px solid #3A2A26; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  aside header { padding: 16px 16px 8px; }
  aside h1 { font-family: "Eromash Display", system-ui, sans-serif; font-size: 20px; margin: 0 0 4px; color: #FFD98A; }
  aside .sub { margin: 0; font-size: 13px; color: #E0B2B2; line-height: 1.4; }
  .herr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 16px; }
  button { font: inherit; font-size: 13px; color: #F2ECEC; background: #2A1E1A; border: 1px solid #4A3630; padding: 8px 10px; cursor: pointer; }
  button:hover { border-color: #9C2315; }
  button.activo { background: #9C2315; border-color: #C8402D; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #FFD98A; outline-offset: 1px; }
  .fila { display: flex; gap: 8px; align-items: center; padding: 4px 16px; font-size: 13px; }
  .fila label { display: flex; align-items: center; gap: 6px; }
  .fila input[type=range] { flex: 1; }
  input[type=search], select, input[type=number] { font: inherit; font-size: 14px; background: #111111; color: #F2ECEC; border: 1px solid #4A3630; padding: 7px 8px; }
  input[type=search], select { width: 100%; box-sizing: border-box; }
  input[type=number] { width: 64px; }
  #lista { flex: 1 0 280px; min-height: 280px; overflow: auto; padding: 6px 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; align-content: start; }
  .obj { background: #241A17; border: 1px solid #3A2A26; padding: 4px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .obj canvas { width: 100%; height: 70px; display: block; background: #3B3222; }
  .obj span { font-size: 12px; line-height: 1.2; color: #E0B2B2; }
  .obj.elegido { border-color: #FFD98A; }
  .grupo { grid-column: 1 / -1; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #FFD98A; margin: 8px 0 0; }
  footer { border-top: 1px solid #3A2A26; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  footer .botones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  footer .botones button { padding: 7px 6px; font-size: 12px; }
  footer .botones select { font-size: 12px; padding: 6px; grid-column: span 2; }
  footer .botones .ancho2b { grid-column: 1 / -1; }
  footer .botones .ancho { grid-column: 1 / -1; background: #9C2315; border-color: #C8402D; }
  #cuenta, #donde { font-size: 12px; color: #B5A5A0; }
  /* abajo del mapa: los pasos que tienen sentido ahora (con su tecla) y una línea corta de cómo moverse */
  #ayuda { position: absolute; left: 12px; bottom: 10px; right: 352px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; pointer-events: none; }
  #ayuda > small { font-size: 12px; color: #E0B2B2; background: rgba(17,17,17,0.75); padding: 5px 9px; text-align: right; max-width: 42%; }
  #siguiente { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #siguiente:empty { display: none; }
  #siguiente b { font-size: 12px; color: #FFD98A; background: rgba(17,17,17,0.85); padding: 6px 9px; }
  #siguiente .paso { pointer-events: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 10px; background: rgba(28,23,20,0.92); border: 1px solid #4A3630; color: #F2ECEC; }
  #siguiente span.paso { color: #E0B2B2; }
  #siguiente .paso.primero { border-color: #FFD98A; }
  #siguiente kbd { font: inherit; font-size: 11px; color: #FFD98A; background: #111111; border: 1px solid #4A3630; padding: 1px 5px; }
  .herr button[data-tecla] { position: relative; }
  .herr button[data-tecla]::after { content: attr(data-tecla); position: absolute; top: 2px; right: 4px; font-size: 9px; color: #B5A5A0; }
  .herr button.activo[data-tecla]::after { color: #FFD98A; }
  #hPoner, #hMover, #hBorrar { font-weight: 600; }
  #ponerOpc.apagado { opacity: 0.45; }
  #vistaOpc { margin: 2px 0 4px; }
  #vistaOpc summary { cursor: pointer; padding: 6px 16px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #FFD98A; }
  #bDescargar.pendiente::after { content: " •"; color: #FFD98A; }
  #aviso { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #1C1714; border: 1px solid #9C2315; padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 60%; }
  #aviso.ver { opacity: 1; }
  .oculto { display: none !important; }
  /* el panel del camino y el del agua son iguales, cada uno con su color */
  #camPanel, #aguaPanel { margin: 4px 12px 6px; padding: 10px 4px; border: 1px solid #C9A45A; background: #241A17; display: flex; flex-direction: column; gap: 2px; }
  #aguaPanel { border-color: #73D5DB; }
  #camPanel > b, #aguaPanel > b { padding: 0 12px; color: #FFD98A; font-size: 14px; }
  #aguaPanel > b { color: #73D5DB; }
  #camPanel .fila > span, #aguaPanel .fila > span { width: 56px; }
  #camPanel select, #aguaPanel select { flex: 1; }
  #camPanel .botones3, #aguaPanel .botones3 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 12px 0; }
  #camPanel button, #aguaPanel button { font-size: 12px; padding: 7px 6px; }
  #camPanel .ayudita, #aguaPanel .ayudita { display: block; padding: 4px 12px 0; color: #B5A5A0; font-size: 12px; line-height: 1.35; }
  #selPanel { margin: 4px 12px 6px; padding: 10px 4px 10px; border: 1px solid #FFD98A; background: #241A17; display: flex; flex-direction: column; gap: 2px; }
  #selPanel > b { padding: 0 12px; color: #FFD98A; font-size: 15px; }
  #selPanel > small { padding: 0 12px; color: #B5A5A0; font-size: 12px; }
  #selPanel .fila > span { width: 76px; font-size: 12px; }
  #selPanel .botones3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; padding: 6px 12px 0; }
  #selPanel button { font-size: 12px; padding: 7px 6px; }
  #notaCaja { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); background: #1C1714; border: 1px solid #FFD98A; padding: 14px; display: none; flex-direction: column; gap: 8px; box-sizing: border-box; }
  #notaCaja.ver { display: flex; }
  #notaCaja b { color: #FFD98A; font-size: 14px; }
  #notaCaja textarea { font: inherit; font-size: 15px; background: #111111; color: #F2ECEC; border: 1px solid #4A3630; padding: 8px; resize: vertical; }
  #notaCaja .botones { display: flex; gap: 6px; justify-content: flex-end; }
  #notaCaja .listo { background: #9C2315; border-color: #C8402D; }
  .obj { position: relative; }
  .obj .estrella { position: absolute; top: 4px; right: 6px; font-style: normal; font-size: 16px; color: #B5A5A0; padding: 0 2px; line-height: 1; }
  .obj .estrella.si { color: #FFD98A; }
  #guardadoV { font-size: 12px; color: #7BC86C; }
  footer select { font-size: 13px; padding: 6px; }
  #notaCaja .hecha { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  #mini { position: absolute; left: 12px; top: 12px; width: 200px; height: 130px; border: 1px solid #4A3630; background: #1E2C1B; cursor: pointer; touch-action: none; }
  #revision, #atajos, #iaPanel { position: absolute; background: #1C1714; border: 1px solid #FFD98A; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  #revision { right: 352px; top: 12px; width: min(380px, calc(100vw - 32px)); max-height: 60%; }
  #revision ul { margin: 0; padding: 0; list-style: none; overflow: auto; }
  #revision li button { width: 100%; text-align: left; margin-bottom: 4px; background: #241A17; }
  #atajos { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 32px)); max-height: 80%; }
  #atajos pre { margin: 0; white-space: pre-wrap; font: inherit; font-size: 13px; line-height: 1.5; overflow: auto; color: #F2ECEC; }
  .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cab b { color: #FFD98A; }
  #comandos { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: #1C1714; border: 1px solid #FFD98A; display: flex; flex-direction: column; }
  #comandos input { font: inherit; font-size: 16px; background: #111111; color: #F2ECEC; border: 0; border-bottom: 1px solid #4A3630; padding: 12px 14px; }
  #comandos ul { list-style: none; margin: 0; padding: 4px 0; max-height: 50vh; overflow: auto; }
  #comandos li { padding: 8px 14px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
  #comandos li small { color: #B5A5A0; }
  #comandos li.activo { background: #9C2315; }
  #iaPanel { right: 352px; bottom: 44px; width: min(420px, calc(100vw - 32px)); max-height: calc(100% - 60px); border-color: #73D5DB; }
  #iaPanel .cab b { color: #73D5DB; }
  #iaPanel .fila2 { display: flex; gap: 6px; }
  #iaPanel .fila2 > * { flex: 1; min-width: 0; font: inherit; font-size: 13px; background: #111111; color: #F2ECEC; border: 1px solid #4A3630; padding: 7px 8px; }
  #iaPanel small { color: #B5A5A0; font-size: 12px; line-height: 1.35; }
  #iaPanel textarea { font: inherit; font-size: 14px; background: #111111; color: #F2ECEC; border: 1px solid #4A3630; padding: 8px; resize: vertical; }
  #iaChat { overflow: auto; display: flex; flex-direction: column; gap: 6px; max-height: 32vh; }
  #iaChat p { margin: 0; font-size: 13px; line-height: 1.4; padding: 6px 8px; background: #241A17; border-left: 3px solid #73D5DB; white-space: pre-wrap; }
  #iaChat p.yo { border-left-color: #FFD98A; }
  #iaChat p.error { border-left-color: #C8402D; }
  #iaPanel .botones { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  #iaPanel .listo { background: #9C2315; border-color: #C8402D; }
  .herr .ancho3 { grid-column: 1 / -1; }
  .herr .ancho2 { grid-column: span 2; }
  /* el generador de texturas: arriba a la izquierda, debajo del minimapa */
  #txPanel { position: absolute; left: 12px; top: 152px; width: min(380px, calc(100vw - 32px)); max-height: calc(100% - 240px); overflow: auto; background: #1C1714; border: 1px solid #F5A524; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  #txPanel .cab b { color: #F5A524; }
  #txPanel .txArriba { display: flex; gap: 10px; }
  #txVista { width: 176px; height: 176px; flex: none; border: 1px solid #4A3630; display: block; }
  #txPanel .txVistaCol { display: flex; flex-direction: column; gap: 6px; width: 176px; flex: none; }
  #txPanel.soltando { border-color: #FFD98A; box-shadow: inset 0 0 0 2px #FFD98A; }
  #txMuestras { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; }
  #txMuestras button { padding: 0; height: 16px; border: 1px solid #111111; }
  #txPanel .txTonos button, #txPanel .txDatos .fila2 button { flex: 1; font-size: 12px; padding: 6px 4px; }
  #txPanel .fila > span, #txPanel .fila2 > span { min-width: 64px; font-size: 12px; }
  #txPanel .txColores input.activo { outline: 2px solid #FFD98A; outline-offset: 1px; }
  #txVariantesL { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  #txVariantesL canvas { width: 100%; aspect-ratio: 1; cursor: pointer; border: 1px solid #4A3630; }
  #txVariantesL canvas:hover { border-color: #FFD98A; }
  #txPanel .txChk { display: flex; gap: 4px; align-items: center; font-size: 12px; white-space: nowrap; }
  .txFicha small { font-size: 10px; color: #B5A5A0; }
  #txPanel .txDatos { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  #txPanel input[type=text], #txPanel textarea, #txPanel select { font: inherit; font-size: 13px; background: #111111; color: #F2ECEC; border: 1px solid #4A3630; padding: 6px 8px; box-sizing: border-box; width: 100%; }
  #txPanel textarea { resize: vertical; }
  #txPanel .fila { padding: 2px 0; }
  #txPanel .fila2 { display: flex; gap: 6px; align-items: center; }
  #txPanel .fila2 > select { flex: 1; }
  #txPanel .txColores input { flex: 1; height: 30px; padding: 0; border: 1px solid #4A3630; background: #111111; }
  #txPanel .txOpc { font-size: 12px; flex-wrap: wrap; }
  #txPanel .txOpc label { display: flex; gap: 4px; align-items: center; }
  #txPanel .txSub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #FFD98A; }
  #txPanel .listo { background: #9C2315; border-color: #C8402D; }
  #txManual.apagado { opacity: 0.45; }
  #txEstado { font-size: 12px; color: #B5A5A0; min-height: 1em; }
  #txEstado.error { color: #FF8D71; }
  #txLista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
  .txFicha { display: flex; align-items: center; gap: 6px; padding: 4px; text-align: left; position: relative; }
  .txFicha canvas { width: 36px; height: 36px; flex: none; }
  .txFicha span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .txFicha i { font-style: normal; color: #B5A5A0; padding: 0 4px; }
  .txFicha.elegido { border-color: #F5A524; }
  #pincelPanel { margin: 4px 12px; padding: 6px 0; border: 1px solid #7BC86C; }
  #pincelPanel .fila select { width: 100%; }
  .pincelAyuda { display: block; padding: 2px 16px; color: #B5A5A0; font-size: 12px; line-height: 1.35; }
  #selInterior { margin: 4px 16px; background: #2A3A3C; border-color: #73D5DB; }
  /* los interiores: el cuarto de frente a la izquierda, su panel a la derecha */
  #cuartos { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr) 320px; background: #0A0606; }
  #cuartos.oculto { display: none; }
  #cuartoLienzo { width: 100%; height: 100%; display: block; touch-action: none; }
  #cuartos aside { overflow: auto; }
  #cuartos aside header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #cuartos .fila select { flex: 1; }
  #cuartos small { display: block; padding: 2px 16px; color: #B5A5A0; font-size: 12px; line-height: 1.35; }
  #cuSel { margin: 6px 12px; padding: 8px 4px; border: 1px solid #73D5DB; }
  #cuSel b { padding: 0 12px; color: #73D5DB; }
  #cuSel .botones3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #cuLista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 6px 12px 16px; }
  @media (max-width: 760px) { #cuartos { grid-template-columns: 1fr; grid-template-rows: 55% 45%; } }
  body.foco .ed { grid-template-columns: minmax(0, 1fr); }
  body.foco aside, body.foco #ayuda { display: none; }
  body.foco #revision, body.foco #iaPanel { right: 12px; }
  @media (max-width: 760px) {
    #mini { display: none; }
    #revision, #iaPanel { right: 12px; }
    #txPanel { top: 12px; max-height: calc(55% - 24px); }
    .ed { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { border-left: 0; border-top: 1px solid #3A2A26; }
    #ayuda { right: 12px; bottom: calc(45% + 8px); }
  }
</style>
</head>
<body>
<div class="ed">
  <canvas id="mapa"></canvas>
  <aside>
    <header>
      <h1 data-i18n="ed.titulo"></h1>
      <p class="sub" data-i18n="ed.sub"></p>
    </header>
    <div class="herr">
      <button id="hPoner" data-tecla="1" class="activo" data-i18n="ed.poner"></button>
      <button id="hMover" data-tecla="2" data-i18n="ed.mover"></button>
      <button id="hBorrar" data-tecla="3" data-i18n="ed.borrar"></button>
      <button id="hCamino" data-tecla="4" data-i18n="ed.camino"></button>
      <button id="hNota" data-tecla="5" data-i18n="ed.nota"></button>
      <button id="hAgua" data-tecla="6" data-i18n="ed.agua"></button>
      <button id="hMedir" data-tecla="7" data-i18n="ed.medir"></button>
      <button id="hIA" data-tecla="8" data-i18n="ed.ia"></button>
      <button id="hComandos" data-tecla="Ctrl+K" data-i18n="ed.comandos"></button>
      <button id="hRegion" data-tecla="0" data-i18n="ed.region"></button>
      <button id="hPincel" data-tecla="B" data-i18n="ed.pincel"></button>
      <button id="hInteriores" data-tecla="9" data-i18n="ed.interiores"></button>
      <button id="hTexturas" data-tecla="Y" class="ancho3" data-i18n="ed.texturas"></button>
    </div>
    <div id="camPanel" class="oculto">
      <b id="camTitulo"></b>
      <div class="fila"><span data-i18n="ed.cam_tipo"></span><select id="camTipo"><option value="tierra" data-i18n="ed.cam_tierra"></option><option value="adoquin" data-i18n="ed.cam_adoquin"></option><option value="ladrillo" data-i18n="ed.cam_ladrillo"></option></select></div>
      <div class="fila"><span data-i18n="ed.cam_borde"></span><select id="camBorde"><option value="" data-i18n="ed.cam_b_ninguno"></option><option value="pasto" data-i18n="ed.cam_b_pasto"></option><option value="musgo" data-i18n="ed.cam_b_musgo"></option><option value="agua" data-i18n="ed.cam_b_agua"></option><option value="tierra" data-i18n="ed.cam_b_tierra"></option></select></div>
      <div class="fila"><label><input id="camFundir" type="checkbox" checked /><span data-i18n="ed.cam_fundir"></span></label></div>
      <div id="camElegido" class="oculto">
        <div class="fila"><span data-i18n="ed.cam_ancho"></span><input id="camAncho" type="range" min="40" max="400" step="5" value="110" /><b id="camAnchoV">110</b></div>
        <div id="camTramo" class="oculto"><div class="fila"><span id="camTramoN"></span><select id="camTramoTipo"><option value="" data-i18n="ed.cam_como_camino"></option><option value="tierra" data-i18n="ed.cam_tierra"></option><option value="adoquin" data-i18n="ed.cam_adoquin"></option><option value="ladrillo" data-i18n="ed.cam_ladrillo"></option></select></div><div class="botones3"><button id="camTramoSacar" data-i18n="ed.cam_tramo_sacar"></button></div></div>
        <small class="ayudita" data-i18n="ed.cam_puntos"></small>
        <div class="botones3"><button id="camCortar" data-i18n="ed.cam_cortar"></button><button id="camSacar" data-i18n="ed.cam_sacar"></button><button id="camSoltar" data-i18n="ed.sel_soltar"></button></div>
      </div>
    </div>
    <div id="aguaPanel" class="oculto">
      <b id="aguaTitulo"></b>
      <div id="aguaNueva" class="fila"><span data-i18n="ed.agua_forma"></span><select id="aguaForma"><option value="rio" data-i18n="ed.agua_f_rio"></option><option value="laguna" data-i18n="ed.agua_f_laguna"></option></select></div>
      <div id="aguaFilaAncho" class="fila"><span data-i18n="ed.cam_ancho"></span><input id="aguaAncho" type="range" min="80" max="900" step="10" value="300" /><b id="aguaAnchoV">300</b></div>
      <div id="aguaFilasLago" class="oculto">
        <div class="fila"><span data-i18n="ed.sel_ancho"></span><input id="aguaRx" type="range" min="150" max="2400" step="10" value="600" /><b id="aguaRxV">600</b></div>
        <div class="fila"><span data-i18n="ed.sel_alto"></span><input id="aguaRy" type="range" min="100" max="1800" step="10" value="400" /><b id="aguaRyV">400</b></div>
      </div>
      <div id="aguaTramo" class="oculto">
        <div class="fila"><span id="aguaTramoN"></span><input id="aguaTramoAncho" type="range" min="80" max="900" step="10" value="300" /><b id="aguaTramoV">300</b></div>
        <div class="botones3"><button id="aguaTramoComo" data-i18n="ed.agua_como_rio"></button></div>
      </div>
      <small id="aguaAyuda" class="ayudita" data-i18n="ed.agua_puntos"></small>
      <div id="aguaElegida" class="oculto"><div class="botones3"><button id="aguaSacar" data-i18n="ed.agua_sacar"></button><button id="aguaSoltar" data-i18n="ed.sel_soltar"></button></div></div>
    </div>
    <div id="pincelPanel" class="oculto">
      <div class="fila"><select id="pincelModo">
